name: life_mate_flutter
description: Life Mate — a private, calm personal life OS.
publish_to: none
version: 1.2.0+100000
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hive: ^2.2.3
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  cloud_functions: ^5.6.2
  file_picker: ^10.3.3
  image_picker: 1.1.2
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  local_auth: ^2.3.0
  speech_to_text: ^7.3.0
  audioplayers: ^6.5.1
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: 3.0.1
  intl: ^0.20.2
  uuid: ^4.5.1
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.28
  image_picker_android: 0.8.12+24
  path_provider_android: 2.2.17
  url_launcher_android: 6.3.16
  local_auth_android: 1.0.49
  package_info_plus: 8.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/rain.wav
    - assets/logo.png
  module:
    androidX: true
    androidPackage: com.lifemate.flutterbridge
    iosBundleIdentifier: com.lifemate
