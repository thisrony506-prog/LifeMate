name: LifeMate Release APK
on:
  push:
    branches: [main, 'arena/**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
concurrency:
  group: lifemate-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  device-tests:
    name: Verify app features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash scripts/run-device-tests.sh
      - name: Test result messages
        if: always()
        run: python3 scripts/report-ci.py device.log
  build:
    name: Build Release APK
    needs: device-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIFEMATE_KEYSTORE_BASE64: ${{ secrets.LIFEMATE_KEYSTORE_BASE64 }}
      LIFEMATE_STORE_PASSWORD: ${{ secrets.LIFEMATE_STORE_PASSWORD }}
      LIFEMATE_KEY_ALIAS: ${{ secrets.LIFEMATE_KEY_ALIAS }}
      LIFEMATE_KEY_PASSWORD: ${{ secrets.LIFEMATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Prepare optional private release signing
        run: bash scripts/prepare-signing.sh
      - name: Compile, test, lint and build release
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace 2>&1 | tee compile.log
      - name: Prepare the single APK download
        run: |
          mkdir -p release-download
          if [[ "${LIFEMATE_SIGNED_RELEASE}" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk release-download/LifeMate-release.apk
            apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
            "$apksigner" verify --verbose release-download/LifeMate-release.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-download/LifeMate-release-unsigned.apk
          fi
          test "$(find release-download -type f | wc -l)" -eq 1
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          "$aapt" dump badging release-download/*.apk > "$RUNNER_TEMP/lifemate-badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/lifemate-badging.txt"; then
            echo '::error::Refusing to publish a debuggable APK as a release.'
            exit 1
          fi
      - name: Upload only LifeMate Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeMate-Release-APK
          path: release-download/*.apk
          if-no-files-found: error
          compression-level: 0
      - name: Build result messages
        if: always()
        run: python3 scripts/report-ci.py compile.log
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/lifemate-release.jks"
