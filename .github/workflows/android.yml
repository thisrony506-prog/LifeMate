# PR checks never publish APKs. Push/manual runs on the release branch also verify private signing and upgrades.
name: LifeMate Release APK
on:
  push:
    branches: [main, 'arena/**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
concurrency:
  group: lifemate-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  device-tests:
    name: Verify app features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash scripts/run-device-tests.sh
      - name: Test result messages
        if: always()
        run: python3 scripts/report-ci.py device.log
  verify:
    name: Compile, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing and release script tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -v 2>&1 | tee compile.log
          mkdir -p "$RUNNER_TEMP/lifemate-script-checks"
          javac -d "$RUNNER_TEMP/lifemate-script-checks" scripts/SignReleaseMetadata.java 2>&1 | tee -a compile.log
      - name: Assign version
        run: python3 scripts/release-version.py
      - name: Verify all code (no unsigned download)
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace 2>&1 | tee compile.log
          javac -cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" -d "$RUNNER_TEMP/lifemate-script-checks" scripts/VerifiedApkSigner.java 2>&1 | tee -a compile.log
      - name: Verification messages
        if: always()
        run: python3 scripts/report-ci.py compile.log
  build:
    name: Signed APK and safe upgrade
    needs: [device-tests, verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/arena/01a090c4-lifemate'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      LIFEMATE_KEYSTORE_BASE64: ${{ secrets.LIFEMATE_KEYSTORE_BASE64 }}
      LIFEMATE_STORE_PASSWORD: ${{ secrets.LIFEMATE_STORE_PASSWORD }}
      LIFEMATE_KEY_ALIAS: ${{ secrets.LIFEMATE_KEY_ALIAS }}
      LIFEMATE_KEY_PASSWORD: ${{ secrets.LIFEMATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Require retained release signing
        run: bash scripts/prepare-signing.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Assign version
        run: python3 scripts/release-version.py
      - name: Build and verify signing continuity
        run: |
          set -o pipefail
          bash scripts/prepare-upgrade-apks.sh 2>&1 | tee compile.log
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install signed release and verify data-preserving upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash -o pipefail -c 'python3 -u scripts/verify-release-install.py 2>&1 | tee -a compile.log'
      - name: Publish versioned APK for in-app updates
        run: |
          set -o pipefail
          bash scripts/publish-release.sh 2>&1 | tee -a compile.log
      - name: Upload only installable LifeMate Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeMate-Release-APK
          path: release-download/*.apk
          if-no-files-found: error
      - name: Build result messages
        if: always()
        run: python3 scripts/report-ci.py compile.log
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/lifemate-release.jks"
