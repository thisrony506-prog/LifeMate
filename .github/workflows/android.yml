name: Android verification
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, lint, unit tests, and APKs
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace 2>&1 | tee compile.log
      - name: Publish readable diagnostics
        if: always()
        run: python3 scripts/report-ci.py compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LifeMate-build-and-reports
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/schemas/
            compile.log
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash -o pipefail -c './gradlew connectedDebugAndroidTest --stacktrace 2>&1 | tee device.log' 
      - name: Publish device diagnostics
        if: always()
        run: python3 scripts/report-ci.py device.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
