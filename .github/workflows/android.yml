name: Android verification
on:
  push:
    branches: [main, 'arena/**']
    paths-ignore: ['.github/workflows/inspect-results.yml', 'docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
concurrency:
  group: lifemate-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Compile, lint, unit tests, and APKs
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace 2>&1 | tee compile.log
      - name: Package release download
        if: success()
        run: |
          mkdir -p release-download
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-download/LifeMate-release-unsigned.apk
          cd release-download
          sha256sum *.apk > SHA256SUMS.txt
          echo 'Optimized unsigned release. Sign with your own retained key before installation. See docs/RELEASE.md.' > READ-ME.txt
      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LifeMate-Release-APK
          path: release-download/
          if-no-files-found: error
      - name: Upload installable test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LifeMate-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish readable diagnostics
        if: always()
        run: python3 scripts/report-ci.py compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LifeMate-build-and-reports
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/schemas/
            compile.log
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash scripts/run-device-tests.sh
      - name: Publish device diagnostics
        if: always()
        run: |
          python3 scripts/report-ci.py device.log
      - name: Light screen preview
        if: always()
        run: python3 scripts/report-assets.py preview-home-light.jpg
      - name: Dark screen preview
        if: always()
        run: python3 scripts/report-assets.py preview-home-dark.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            screenshots/
            device.log
