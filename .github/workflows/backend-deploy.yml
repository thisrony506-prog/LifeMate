name: Deploy approved Life Mate backend
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Your approved Firebase project ID (not a secret)'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: github.ref == 'refs/heads/arena/01a090c4-lifemate'
    runs-on: ubuntu-latest
    environment: firebase-production
    timeout-minutes: 25
    env:
      PROJECT_ID: ${{ inputs.project_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Require approved project and keyless access
        env:
          WIF: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[a-z][a-z0-9-]{4,28}[a-z0-9]',os.environ['PROJECT_ID'])
          assert not os.environ['PROJECT_ID'].startswith('demo-')
          assert os.environ['WIF'] and os.environ['DEPLOYER'], 'Configure approved Workload Identity first; do not upload service-account keys'
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix backend/functions && npm test --prefix backend/functions
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix backend/rules-tests && npm test --prefix backend/rules-tests
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy only to the approved project
        working-directory: backend
        run: ./rules-tests/node_modules/.bin/firebase deploy --project "$PROJECT_ID" --only functions,firestore:rules,storage --non-interactive
